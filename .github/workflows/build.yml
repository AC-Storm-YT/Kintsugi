name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Self-contained, single-file Kintsugi.exe (settings in src/Kintsugi/Kintsugi.csproj).
      - name: Publish
        run: dotnet publish src/Kintsugi/Kintsugi.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: Kintsugi
          path: publish/Kintsugi.exe
          if-no-files-found: error

  release:
    # Pushing a tag such as v1.0.0 publishes a GitHub release with the built exe attached.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kintsugi

      - uses: softprops/action-gh-release@v2
        with:
          files: Kintsugi.exe
          generate_release_notes: true
